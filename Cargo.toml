[package]
name = "human_mortality_database"
version = "0.2.0"
edition = "2024"
authors = ["Christopher Gundler <christopher@gundler.de>"]
license = "MIT"
readme = "README.md"
description = "Query the Human Mortality Database"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
chrono = "0.4.44"
reqwest = { version = "0.13.2", features = ["blocking", "cookies"] }
serde_urlencoded = "0.7"
pyo3 = { version = "0.23", optional = true, features = ["abi3-py39", "extension-module"] }
